[project]
name = "codebase-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mavinier", email = "mavinier2010@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "UP",  # Pyupgrade
    "B",   # Bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"